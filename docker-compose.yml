services:

    db:
        image: mysql:8.0
        environment:
            MYSQL_DATABASE: test_db
            MYSQL_ROOT_PASSWORD: password
        ports:
            - "3306:3306"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
            interval: 1m30s
            timeout: 30s
            retries: 5

    secured-jwt-sb:
        image: ghcr.io/freix-st/secured-jwt-sb:latest
        container_name: secured-jwt-sb
        ports:
            - "8080:8080"
        env_file:
            - .env # JWT_SECRET_KEY
        environment:
            SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/test_db?useSSL=false&allowPublicKeyRetrieval=true&Is serverTimezone=UTC
            SPRING_DATASOURCE_USERNAME: root
            SPRING_DATASOURCE_PASSWORD: password
        depends_on:
            db:
                condition: service_healthy
