name: Build image and push to GHCR

on:
  push:
    branches: 
      - hotfix/*
      - release/*
      - develop
      - feature/*
    tags:
      - 'v*.*.*'
  pull_request:
    types: [opened]
    branches:
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-app:
    name: Build and Package app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./securedjwt

    # Setup temporary DB for build
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test_db
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Build JAR artifact
        env:
          JWT_SECRET_KEY: ${{ secrets.FRENCH_KEYS }}
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/test_db
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
        run: mvn clean package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: ./securedjwt/target/*.jar

  build-docker:
    needs: build-app
    name: Build docker image
    runs-on: ubuntu-latest
    env:
      SHORT_SHA: "unknown"
      RC_VERSION: ""

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download JAR artifact
        uses: actions/download-artifact@v7
        with:
          name: app-jar
          path: ./securedjwt/target/

      - name: Compute short SHA
        id: vars
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Get RC version
        id: var-rc-version
        run: |
          if [[ ${{ startsWith(github.ref, 'refs/heads/release/') }} ]]; then
            BRANCH=${{ github.ref_name }}
            VERSION="${BRANCH#release/}"

            echo "RC_VERSION=${VERSION}" >> $GITHUB_ENV
          fi

      - name: Extract docker metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          tags: |
            # PROD
            type=semver, pattern={{version}}, enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw, value=latest, enable=${{ startsWith(github.ref, 'refs/tags/v') }}

            # STAGING
            type=raw, value=${{ env.RC_VERSION }}, suffix=-rc, enable=${{ startsWith(github.ref, 'refs/heads/release/') }}

            # DEVELOP
            type=ref, event=branch, enable=${{ startsWith(github.ref, 'refs/heads/develop') }}

            # DEVELOP-SHA
            type=sha, format=short, prefix=dev-, enable=${{ startsWith(github.ref, 'refs/heads/develop') }}

            # FEATURE-SHA
            type=raw, prefix=pr-, value=${{ env.SHORT_SHA }}, enable=${{ startsWith(github.ref, 'refs/heads/feature/') }}
            type=ref, event=pr, suffix=-${{ env.SHORT_SHA }}, enable=${{ startsWith(github.event.pull_request.head.ref, 'feature/') }}

            # COMMIT-SHA
            type=sha, format=short, enable=${{ 
              !startsWith(github.ref, 'refs/heads/develop') &&
              !startsWith(github.ref, 'refs/heads/feature/')
            }}

      - name: Push condition
        id: push-condition
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          PR_COUNT=$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq 'length')

          if [[ "$BRANCH_NAME" =~ ^feature/ &&
                "$PR_COUNT" -eq 0 ]]; then
            echo "PUSH_IMAGE=false" >> $GITHUB_OUTPUT
          else
            echo "PUSH_IMAGE=true" >> $GITHUB_OUTPUT
          fi

      - name: Build and push docker
        uses: docker/build-push-action@v7
        with:
          context: ./securedjwt
          file: ./securedjwt/Dockerfile
          push: ${{ steps.push-condition.outputs.PUSH_IMAGE }}
          tags: ${{ steps.docker-meta.outputs.tags}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}